[project]
name = "omarmassfih-no-backend"
version = "0.1.0"
description = "Backend service for omarmassfih.no."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
