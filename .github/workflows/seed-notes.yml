name: Seed notes

on:
  push:
    branches: ["main"]
    paths:
      - "notes/**"
      - "app/notes.py"
      - "app/database.py"
      - "app/gateway.py"
      - "app/rag.py"
      - "scripts/seed_notes.py"
      - "scripts/embed_notes.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/seed-notes.yml"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Seed notes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/seed_notes.py

      - name: Embed notes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "AI_GATEWAY_API_KEY is not set; skipping embeddings"
            exit 0
          fi

          uv run python scripts/embed_notes.py

      - name: Trigger frontend deploy
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REDEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FRONTEND_REDEPLOY_TOKEN is not set; skipping frontend deploy"
            exit 0
          fi

          gh api repos/omar-massfih/omarmassfih.no/dispatches \
            -f event_type=notes_updated \
            -F client_payload[backend_sha]=${{ github.sha }}
